apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafdrop
  namespace: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafdrop
  template:
    metadata:
      labels:
        app: kafdrop
    spec:
      containers:
        - name: kafdrop
          image: obsidiandynamics/kafdrop:latest
          ports:
            - containerPort: 9000
          env:
            - name: KAFKA_BROKERCONNECT
              value: "pipeline-kafka-kafka-bootstrap:9092"
            - name: JVM_OPTS
              value: "-Xms64M -Xmx128M -XX:MaxMetaspaceSize=128M"
            - name: SERVER_PORT
              value: "9000"
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 384Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: kafdrop
  namespace: ingestion
spec:
  selector:
    app: kafdrop
  ports:
    - port: 9000
      targetPort: 9000
