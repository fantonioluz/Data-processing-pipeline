# helm/values/minio.yaml
# Chart: minio/minio (oficial) — imagem minio/minio com suporte multi-arch (amd64 + arm64)

rootUser: admin
rootPassword: admin123

mode: standalone

# Cria o bucket automaticamente na primeira inicialização
buckets:
  - name: datalake
    policy: none
    purge: false

persistence:
  enabled: true
  storageClass: standard   # local-path-provisioner do Kind
  size: 2Gi

service:
  type: ClusterIP
  port: "9000"

consoleService:
  type: ClusterIP
  port: "9001"

nodeSelector:
  workload: storage

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
